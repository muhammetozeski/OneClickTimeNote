apply plugin: 'com.android.application'

buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.0.2'
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
    }
}

android {
    compileSdkVersion 33
    defaultConfig {
        applicationId "com.oneclick.timenote"
        // 26 lets FLAG_IMMUTABLE, getCodeCacheDir() and VibrationEffect be called
        // unconditionally, so no Build.VERSION.SDK_INT guard ends up in the dex.
        minSdkVersion 26
        // Comes from Derle.ps1 (-PtargetSdk), 29 otherwise: an APK with targetSdk 30+
        // needs a v2 signature to install on Android 11+, which costs ~8 KB.
        targetSdkVersion (project.hasProperty('targetSdk') ? project.targetSdk.toInteger() : 29)
        versionCode 1
        versionName "1.0.0"
    }
    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    // Toast texts in the sources are Turkish; javac must not fall back to the
    // Windows default charset or the diacritics get mangled.
    compileOptions {
        encoding = 'UTF-8'
    }
    namespace 'com.oneclick.timenote'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
